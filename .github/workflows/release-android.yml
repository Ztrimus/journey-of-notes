# ─────────────────────────────────────────────────────────────────────────────
# Journey of Notes — Android APK Release
#
# NO third-party accounts needed. No EAS. No Expo login.
# Uses only: GitHub Actions (free for public repos) + GITHUB_TOKEN (auto-provided).
#
# TRIGGER:  push to main
# WHAT:
#   1. expo prebuild generates the native android/ project from app.json
#   2. Gradle builds a debug-signed APK (installable on any Android device)
#   3. A GitHub Release is created and the APK is attached
#
# VERSIONING:
#   Bump "version" + "android.versionCode" in app.json before pushing to main.
#   Each unique version string gets its own Release.
#   Pushes that don't change the version are skipped (no duplicate release).
#
# ─── UPGRADING TO RELEASE-SIGNED APK (optional, for Play Store later) ────────
#   A debug-signed APK works perfectly for personal sideloading.
#   When you need a proper release signing key (e.g. Play Store):
#   1. Generate a keystore:
#        keytool -genkey -v -keystore release.keystore -alias release \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. Base64-encode it:
#        base64 -i release.keystore | pbcopy
#   3. Add GitHub secrets:
#        ANDROID_KEYSTORE_BASE64   ← the base64 string
#        ANDROID_KEY_ALIAS         ← e.g. "release"
#        ANDROID_KEY_PASSWORD      ← key password
#        ANDROID_STORE_PASSWORD    ← store password
#   4. Add a signing config to android/app/build.gradle (generated by prebuild)
#      and change assembleDebug → assembleRelease below.
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release Android APK

on:
  push:
    branches: [main]

# GITHUB_TOKEN needs write access to create releases and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    name: Gradle Build → GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node ────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flute-tempo-trainer/package-lock.json

      - name: Install npm dependencies
        working-directory: flute-tempo-trainer
        run: npm ci

      # ── 3. Java (required by Gradle / Android build tools) ─────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 4. Version ────────────────────────────────────────────────────────
      - name: Read version from app.json
        id: app_version
        run: |
          VERSION=$(node -p "require('./flute-tempo-trainer/app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT
          echo "apk=journey-of-notes-v${VERSION}.apk" >> $GITHUB_OUTPUT

      # ── 5. Skip if this version was already released ───────────────────────
      - name: Check for existing release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.app_version.outputs.tag }}" \
               --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.app_version.outputs.tag }} exists — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No release for ${{ steps.app_version.outputs.tag }} — building."
          fi

      # ── 6. Accept Android SDK licenses (silences sdkmanager prompts) ───────
      - name: Accept Android SDK licenses
        if: steps.release_check.outputs.exists == 'false'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses \
            > /dev/null 2>&1 || true

      # ── 7. Generate native Android project ────────────────────────────────
      #    expo prebuild reads app.json and writes android/ (already gitignored)
      - name: Generate android/ via expo prebuild
        if: steps.release_check.outputs.exists == 'false'
        working-directory: flute-tempo-trainer
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      # ── 8. Gradle cache (speeds up repeat builds significantly) ────────────
      - name: Cache Gradle
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('flute-tempo-trainer/android/**/*.gradle*', 'flute-tempo-trainer/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 9. Build debug APK ─────────────────────────────────────────────────
      #    Output: flute-tempo-trainer/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build APK
        if: steps.release_check.outputs.exists == 'false'
        working-directory: flute-tempo-trainer/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 10. Rename APK ─────────────────────────────────────────────────────
      - name: Rename APK
        if: steps.release_check.outputs.exists == 'false'
        run: |
          cp flute-tempo-trainer/android/app/build/outputs/apk/debug/app-debug.apk \
             "${{ steps.app_version.outputs.apk }}"
          echo "APK size: $(du -sh "${{ steps.app_version.outputs.apk }}")"

      # ── 11. Create GitHub Release ──────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: "Journey of Notes ${{ steps.app_version.outputs.tag }}"
          body: |
            ## Install on Android
            1. Download **`${{ steps.app_version.outputs.apk }}`** below
            2. On your phone: **Settings → Install unknown apps** → allow your browser or Files app
            3. Tap the downloaded APK to install

            > This is a debug-signed build — safe for personal sideloading.
          files: ${{ steps.app_version.outputs.apk }}
          draft: false
          prerelease: false
