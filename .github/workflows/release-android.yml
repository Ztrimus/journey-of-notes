# ─────────────────────────────────────────────────────────────────────────────
# Journey of Notes — Android Release Pipeline
#
# NO third-party accounts needed. No EAS. No Expo login.
# Uses only GitHub Actions (free for public repos) + auto-provided GITHUB_TOKEN.
#
# TRIGGER:  push to main
#
# JOB 1 — apk-release (always runs)
#   expo prebuild → assembleDebug → GitHub Release with APK attached
#   For personal sideloading / over-the-air updates via useUpdateCheck hook.
#
# JOB 2 — aab-play-store (runs only when ANDROID_KEYSTORE_BASE64 secret exists)
#   expo prebuild → bundleRelease (signed AAB) → artifact for Play Store upload
#   Upload the AAB manually in Play Console the first time; after that automate.
#
# VERSIONING:
#   Bump "version" + "android.versionCode" in flute-tempo-trainer/app.json.
#   Each unique version string gets its own GitHub Release.
#   Pushes with an already-released version are skipped.
#
# ─── PLAY STORE SETUP (one-time, do this once) ───────────────────────────────
#   The release keystore has been generated. Add these 4 secrets to the repo:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
#   ANDROID_KEYSTORE_BASE64   (run: base64 -i journey-of-notes-release.keystore | pbcopy)
#   ANDROID_KEY_ALIAS         journey-of-notes
#   ANDROID_KEY_PASSWORD      WjpHaU54E3s8eONSi6TuVROs
#   ANDROID_STORE_PASSWORD    5nw3Kl5OMunvaWnJqehDbfIg
#
#   ⚠️  IMPORTANT: Save the keystore file somewhere safe (iCloud, password manager).
#       If you lose it you cannot update your Play Store app — ever.
#       Keystore location: /tmp/journey-of-notes-release.keystore  ← move this now
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release Android

on:
  push:
    branches: [main]

permissions:
  contents: write

# ─── Shared setup steps (used by both jobs via reuse pattern) ─────────────────
# Both jobs do: checkout → node → java → version check → prebuild → gradle cache

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: Debug APK → GitHub Release  (personal sideloading)
  # ════════════════════════════════════════════════════════════════════════════
  apk-release:
    name: Debug APK → GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flute-tempo-trainer/package-lock.json

      - name: Install dependencies
        working-directory: flute-tempo-trainer
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: ver
        run: |
          V=$(node -p "require('./flute-tempo-trainer/app.json').expo.version")
          echo "version=$V"          >> $GITHUB_OUTPUT
          echo "tag=v$V"             >> $GITHUB_OUTPUT
          echo "apk=journey-of-notes-v${V}.apk" >> $GITHUB_OUTPUT

      - name: Skip if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" \
               --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true"  >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Accept Android SDK licenses
        if: steps.check.outputs.exists == 'false'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: expo prebuild
        if: steps.check.outputs.exists == 'false'
        working-directory: flute-tempo-trainer
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Cache Gradle
        if: steps.check.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('flute-tempo-trainer/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build debug APK
        if: steps.check.outputs.exists == 'false'
        working-directory: flute-tempo-trainer/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        if: steps.check.outputs.exists == 'false'
        run: |
          cp flute-tempo-trainer/android/app/build/outputs/apk/debug/app-debug.apk \
             "${{ steps.ver.outputs.apk }}"

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Journey of Notes ${{ steps.ver.outputs.tag }}"
          body: |
            ## Install on Android
            1. Download **`${{ steps.ver.outputs.apk }}`** below
            2. Phone: **Settings → Install unknown apps** → allow browser/Files
            3. Tap the APK to install

            > Debug-signed build — for personal sideloading only.
            > Play Store build is a separate signed AAB (see aab-play-store job).
          files: ${{ steps.ver.outputs.apk }}

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: Signed AAB → Play Store artifact  (runs only when secrets are set)
  # ════════════════════════════════════════════════════════════════════════════
  aab-play-store:
    name: Signed AAB → Play Store
    runs-on: ubuntu-latest
    # Only runs when the keystore secret has been added
    if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flute-tempo-trainer/package-lock.json

      - name: Install dependencies
        working-directory: flute-tempo-trainer
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: expo prebuild
        working-directory: flute-tempo-trainer
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > flute-tempo-trainer/android/app/release.keystore

      - name: Inject signing config into build.gradle
        working-directory: flute-tempo-trainer/android/app
        env:
          KEY_ALIAS:        ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:     ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD:   ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Append signing config before the existing android {} block close
          cat >> build.gradle << 'EOF'

          // ── Release signing (injected by CI) ──────────────────────────────
          android.signingConfigs {
            release {
              storeFile     file("release.keystore")
              storePassword System.getenv("STORE_PASSWORD")
              keyAlias      System.getenv("KEY_ALIAS")
              keyPassword   System.getenv("KEY_PASSWORD")
            }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ hashFiles('flute-tempo-trainer/android/**/*.gradle*') }}
          restore-keys: gradle-aab-

      - name: Build signed AAB
        working-directory: flute-tempo-trainer/android
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-store-aab-${{ github.sha }}
          path: flute-tempo-trainer/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
